; jevban: copy to /etc/jevban/jevban.ini (or next to the binary)

[jevban]
; access logs to follow; comma separated, wildcards allowed in the file name
logpath = /var/log/apache2/access.log, /var/log/apache2/*access.log
; never judged or banned
ignoreip = 127.0.0.0/8 ::1
; maxretry strikes within findtime seconds -> banned for bantime seconds
findtime = 600
maxretry = 3
bantime = 3600
; repeat offenders: bantime doubles per ban, up to maxtime
bantime.increment = 1
bantime.maxtime = 604800
statefile = /var/lib/jevban/state.json
; also log here (a fail2ban filter can match its "Ban <ip>" lines)
logfile =
; prefilter: a request scoring this much goes to the decider (weights: 3 site-dependent, 6 probe, 10 attack)
suspicious_score = 3
; this many 4xx from one client within findtime is suspicious too (0 = off)
flood_4xx = 40
; extra rules, one per line: <weight> <url|request|agent|any> <tag> <regex>
signatures =
builtin_signatures = 1
; requests per client shown to the model as context
context_lines = 6
verbose = 0

[decider]
; jev: ask a Jev-style decision API; rules: signatures only
mode = jev
; OpenJev's helper (helper/shim.py) or the hosted Jev API
url = http://127.0.0.1:3000/v1/systemone
; bearer token; or the JEV_API_KEY environment variable
api_key =
model = openjev
timeout_ms = 8000
; P(malicious) that counts as a strike / bans at once
threshold = 0.80
instant_threshold = 0.97
; reuse a client's verdict this long (one call per scanner, not one per probe)
cache_secs = 60
; more calls than this per minute -> the rules decide
max_per_minute = 120
; decider unreachable: rules | skip
on_error = rules
rules_min_score = 6
rules_instant_score = 20
; jev mode: a signature score this high is a strike whatever the model says (0 = off; 10 = trust the strong rules)
override_score = 0
; tell the model what this server is; this is what makes "/wp-login.php" a probe or a normal login
site = A public web server. Judge requests against what a normal visitor or a well-behaved search engine would ask for.
;site = A static Hugo blog. It runs no PHP, no WordPress and no admin panel; any request for those is a probe.

[action]
; iptables | nftables | ufw | firewalld | fail2ban | netsh | command | none
type = iptables
; chain / table name
name = jevban
port = 80,443
; for type = fail2ban
jail = jevban
; any of these replaces the preset's; tags: <ip> <v> <family> <fwfamily> <iptables> <name> <port> <jail> <bantime>
actionstart =
actionstop =
actionban =
actionunban =
dry_run = 0
; actionstop at exit (bans are restored from the state file at the next start)
cleanup_on_exit = 1
