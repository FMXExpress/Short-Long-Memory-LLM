; memagent configuration. Paths are relative to this file.
[agent]
; model profile from models.json: tiny | small | medium | large
profile=tiny
models=models.json
priors=priors.md
data_dir=data
repo_dir=.
python=python3
; turns kept verbatim in the prompt (older ones are summarised / searchable)
recent_turns=6
; facts and old messages retrieved per turn
rag_k=3
min_fact_confidence=0.5

[gpu]
; CUDA device index for each role; -1 = CPU
infer=0
train=1

[consolidate]
auto=1
; start a background consolidation when this many facts are not yet baked...
min_new_facts=3
; ...and at least this many minutes passed since the last one
interval_min=60

[retrieval]
; local models, run in-process via ONNX Runtime. Download them once with: build/memagent --provision
cache_dir=cache
; auto = onnx when provisioned, else the dependency-free lexical embedder | onnx | static | off
embedder=auto
; minilm | bge-small | mxbai
embed_model=minilm
; auto = on when provisioned | off
reranker=auto
; ms-marco-minilm (fast) | ms-marco-minilm-l12 | bge-reranker-base (stronger, 280 MB) | bge-reranker-v2-m3 (GPU)
rerank_model=ms-marco-minilm
; candidates from the FTS5 + vector stage that the reranker re-scores
pool=8
; cosine floor for vector-only candidates (onnx / static embedder)
min_similarity=0.35
static_min_similarity=0.3
; candidates the reranker scores below this are dropped (tuned for ms-marco; use ~0.0005 with bge-reranker-base)
rerank_min=0.005
; a new fact is about an existing subject only if cosine >= dedup_min_cos AND rerank >= dedup_min_rerank
dedup_min_cos=0.7
dedup_min_rerank=0.5
