; memagent configuration. Paths are relative to this file.
[agent]
; model profile from models.json: tiny | small | medium | large
profile=tiny
; what runs the model: auto   = llama.cpp when it loads, else the Python worker (default)
;                      llama  = llama.cpp in-process, GGUF base + GGUF LoRA (scripts/llama_setup.sh)
;                      python = Transformers + PEFT worker (trainer/worker.py)
; training is Python either way. Override per run with --engine.
engine=auto
models=models.json
priors=priors.md
data_dir=data
repo_dir=.
; Python for the trainer (and the python engine); default python3, python on Windows
;python=python3
; turns kept verbatim in the prompt (older ones are summarised / searchable)
recent_turns=6
; facts and old messages retrieved per turn
rag_k=3
min_fact_confidence=0.5
; keep facts that are already trained into the LoRA retrievable as RAG context. Prompt size stays
; bounded by rag_k either way; on bench/facts.json LoRA+RAG answers 0.93 vs 0.78 for the LoRA alone
rag_include_baked=1
; download missing models on startup (the GGUF base model, the retrieval models); --offline = 0
auto_provision=1

[llama]
; read by the llama engine (engine=auto|llama). Defaults: the libraries in <cache_dir>/llama (a source
; build), else lib/ or the folder next to the binary (a release); the llama.cpp checkout with the GGUF
; converters in <cache_dir>/llama.cpp; the model in <cache_dir>/gguf/<profile>.gguf, downloaded from
; the profile's "gguf" url in models.json on first run
;lib_dir=cache/llama
;src_dir=cache/llama.cpp
;model=cache/gguf/tiny.gguf
; CPU threads, 0 = all cores but one (all of them is slower: ggml's workers spin)
threads=0
; layers offloaded to [gpu] infer, -1 = all (ignored when infer = -1)
gpu_layers=-1

[gpu]
; CUDA device index for each role; -1 = CPU
infer=0
train=1

[consolidate]
; llama  = train the LoRA in-process on llama.cpp (Mem.Train): no Python. Needs the llama engine and a
;          llama.cpp with packaging/llama-patches (scripts/llama_setup.sh, the release builds)
; python = trainer/consolidate.py (Transformers + PEFT): the medium/large profiles and engine=python
; llama falls back to python, saying why, when it cannot train
trainer=llama
; CPU threads for the llama trainer, 0 = all cores but one
threads=0
auto=1
; Two memory tiers (llama trainer): new facts go into a small fast LoRA, retrained in the background
; whenever the trainer is free, on top of a frozen deep LoRA; a deep sleep rebuilds the deep LoRA from
; every fact and empties the fast one. auto = on when the trainer can (llama trainer, patched llama.cpp)
tiers=auto
; a fast run starts once this many facts are in no adapter yet
fast_min_new=1
; a deep sleep starts once the fast LoRA holds this many facts (or a fact was forgotten or changed)...
deep_after=8
; Without tiers: a consolidation starts once this many facts are not yet baked...
min_new_facts=3
; ...and, either way, at least this many minutes after the last deep sleep / consolidation
interval_min=60

[priors]
; Standing instructions the user gives ("from now on keep answers short", "never use emojis",
; "I prefer code examples", or /prior <text>) go into every system prompt. Each message counts once
; for or against a prior; confidence = for / (for + against), starting from 1:1 for a remark and
; 3:1 for /prior. A prior contradicted down to deprecate_under is deprecated, never deleted (/priors).
enabled=1
max_in_prompt=6
min_confidence=0.6
deprecate_under=0.4

[retrieval]
; local models, run in-process via ONNX Runtime. Download them once with: build/memagent --provision
cache_dir=cache
; auto = onnx when provisioned, else the dependency-free lexical embedder | onnx | static | off
embedder=auto
; minilm | bge-small | mxbai
embed_model=minilm
; auto = on when provisioned | off
reranker=auto
; ms-marco-minilm (fast) | ms-marco-minilm-l12 | bge-reranker-base (stronger, 280 MB) | bge-reranker-v2-m3 (GPU)
rerank_model=ms-marco-minilm
; candidates from the FTS5 + vector stage that the reranker re-scores
pool=8
; cosine floor for vector-only candidates (onnx / static embedder). Tuned with
; BENCH_SWEEP=1 build/bench_retrieval (bench/README.md): 0.25 + rerank_min 1e-4 gives hit@3 0.97
; dev / 0.975 held-out; stricter floors cut look-alike noise but drop up to 25 points of recall
min_similarity=0.25
static_min_similarity=0.3
; candidates the reranker scores below this are dropped (tuned for ms-marco; use ~0.0005 with bge-reranker-base)
rerank_min=0.0001
; a new fact is about an existing subject only if cosine >= dedup_min_cos AND rerank >= dedup_min_rerank
dedup_min_cos=0.7
dedup_min_rerank=0.5
; a new fact with the same value as a stored one and text cosine >= this is a repeat (skipped, never merged)
dedup_text_cos=0.9

[guard]
; Licensing check against stored-value confabulation: for questions about "my X", an answer that
; uses a stored value belonging to a different subject ("my horse's name" -> the dog's name) is
; replaced with "You haven't told me that yet." Measured on bench/facts.json: confabulation
; 0.70 -> 0.25 (tiny), 0.55 -> 0.20 (small), at a cost of 3-7 points of accuracy.
; auto = on when the model is provisioned | on | off
enabled=auto
model=bge-reranker-base
; bge score a question/fact pair must reach to count as "same subject" when no word is shared
min_score=0.03
